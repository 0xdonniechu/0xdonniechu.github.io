<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 388" width="820" height="388" role="img" aria-labelledby="t d"><title id="t">Doanh thu thô mỗi ha của các cây có cả năng suất và giá</title><desc id="d">Khoảng doanh thu thô mỗi ha: gừng 240–560, chanh dây 188–283, nghệ vàng 72–403, atiso lá 76–287, cà gai leo khô 110–203 triệu đồng. Chưa trừ chi phí, vì chi phí mỗi ha có nguồn gần như không có.</desc>
