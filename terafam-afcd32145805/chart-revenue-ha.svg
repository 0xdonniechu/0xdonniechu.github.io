ha</title></rect><text x="368.0" y="70" class="tx" font-size="12" text-anchor="end" font-weight="600">240</text><text x="545.3333333333333" y="70" class="tx" font-size="12" text-anchor="start" font-weight="600">560</text><text x="578" y="70" class="t2" font-size="10.5" text-anchor="start" font-weight="400">giá từng gấp 4,4 lần (8.000 → 35.000)</text><text x="20" y="124" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Chanh dây</text><text x="20" y="140" class="t2" font-size="10.5" text-anchor="start" font-weight="400">bình quân cả nước 15,7 tấn/ha × 12.000–18.000</text><rect class="a" x="347.1" y="116" width="49.1" height="14" rx="4"><title>Chanh dây: 188 đến 283 triệu đồng/ha</title></rect><text x="341.1333333333333" y="128" class="tx" font-size="12" text-anchor="end" font-weight="600">188</text><text x="402.2166666666667" y="128" class="tx" font-size="12" text-anchor="start" font-weight="600">283</text><text x="578" y="128" class="t2" font-size="10.5" text-anchor="start" font-weight="400">đỉnh 26.000–27.000, rồi vườn bị phá</text><text x="20" y="182" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Nghệ vàng</text><text x="20" y="198" class="t2" font-size="10.5" text-anchor="start" font-weight="400">12–31 tấn/ha × 6.000–13.000 đ/kg</text><rect class="a" x="287.2" y="174" width="171.0" height="14" rx="4"><title>Nghệ vàng: 72 đến 403 triệu đồng/ha</title></rect><text x="281.2" y="186" class="tx" font-size="12" text-anchor="end" font-weight="600">72</text><text x="464.2166666666667" y="186" class="tx" font-size="12" text-anchor="start" font-weight="600">403</text><text x="578" y="186" class="t2" font-size="10.5" text-anchor="start" font-weight="400">giá gấp 4,3 lần; có ca không người mua</text><text x="20" y="240" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Atiso (lá)</text><text x="20" y="256" class="t2" font-size="10.5" text-anchor="start" font-weight="400">38–50 tấn/ha × 2.000–5.700 đ/kg</text><rect class="a" x="289.3" y="232" width="109.0" height="14" rx="4"><title>Atiso (lá): 76 đến 287 triệu đồng/ha</title></rect><text x="283.26666666666665" y="244" class="tx" font-size="12" text-anchor="end" font-weight="600">76</text><text x="404.2833333333333" y="244" class="tx" font-size="12" text-anchor="start" font-weight="600">287</text><text x="578" y="244" class="t2" font-size="10.5" text-anchor="start" font-weight="400">lá Sa Pa ổn định; bông Đà Lạt −80%</text><text x="20" y="298" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Cà gai leo (khô)</text><text x="20" y="314" class="t2" font-size="10.5" text-anchor="start" font-weight="400">5,5–5,8 tấn/ha × 20.000–35.000 đ/kg</text><rect class="a" x="306.8" y="290" width="48.1" height="14" rx="4"><title>Cà gai leo (khô): 110 đến 203 triệu đồng/ha</title></rect><text x="300.8333333333333" y="302" class="tx" font-size="12" text-anchor="end" font-weight="600">110</text><text x="360.8833333333333" y="302" class="tx" font-size="12" text-anchor="start" font-weight="600">203</text><text x="578" y="302" class="t2" font-size="10.5" text-anchor="start" font-weight="400">−81% trong khoảng một năm (2015–16)</text></svg>