<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 478" width="820" height="478" role="img" aria-labelledby="t d"><title id="t">Ví tiền nguyên liệu so với con số thị trường</title><desc id="d">Thanh khoảng thấp đến cao theo thang log: thị trường dược 7.000 đến 8.580 triệu USD, TPCN 960 đến 2.100, rau quả chế biến xuất khẩu 1.520 đến 2.060, dược liệu thô 240 đến 400, nguyên vật liệu 5 hãng dược 173 đến 219, SAM 48 đến 120, trần doanh thu 300 ha 0,9 đến 6,6.</desc>
<style>
.bg{fill:#fcfcfb}.tx{fill:#0b0b0b}.t2{fill:#52514e}.gr{stroke:#e3e2de}.ax{stroke:#8d8c86}
.a{fill:#2a78d6}.b{fill:#eb6834}.c{fill:#1baf7a}
.sa{stroke:#2a78d6}.sb{stroke:#eb6834}.sc{stroke:#1baf7a}
@media (prefers-color-scheme: dark){
