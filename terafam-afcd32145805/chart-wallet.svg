</style><rect class="bg" width="820" height="478"/><rect class="a" x="20" y="15" width="12" height="12" rx="2"/><text x="37" y="25" class="t2" font-size="12" text-anchor="start" font-weight="400">Chi tiêu và kim ngạch cuối</text><rect class="b" x="225.4" y="15" width="12" height="12" rx="2"/><text x="242.4" y="25" class="t2" font-size="12" text-anchor="start" font-weight="400">Ví tiền nguyên liệu</text><rect class="c" x="386.0" y="15" width="12" height="12" rx="2"/><text x="403.0" y="25" class="t2" font-size="12" text-anchor="start" font-weight="400">TeraFam</text><line class="gr" x1="388.6959863908549" x2="388.6959863908549" y1="52" y2="438" stroke-width="1"/><text x="388.6959863908549" y="456" class="t2" font-size="11" text-anchor="middle" font-weight="400">1</text><line class="gr" x1="484.0219897931412" x2="484.0219897931412" y1="52" y2="438" stroke-width="1"/><text x="484.0219897931412" y="456" class="t2" font-size="11" text-anchor="middle" font-weight="400">10</text><line class="gr" x1="579.3479931954274" x2="579.3479931954274" y1="52" y2="438" stroke-width="1"/><text x="579.3479931954274" y="456" class="t2" font-size="11" text-anchor="middle" font-weight="400">100</text><line class="gr" x1="674.6739965977138" x2="674.6739965977138" y1="52" y2="438" stroke-width="1"/><text x="674.6739965977138" y="456" class="t2" font-size="11" text-anchor="middle" font-weight="400">1.000</text><line class="gr" x1="770.0" x2="770.0" y1="52" y2="438" stroke-width="1"/><text x="770.0" y="456" class="t2" font-size="11" text-anchor="middle" font-weight="400">10.000</text><text x="565.0" y="472" class="t2" font-size="11" text-anchor="middle" font-weight="400">triệu USD mỗi năm (thang log)</text><text x="20" y="76" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Thị trường dược, tổng chi tiêu</text><text x="20" y="92" class="t2" font-size="10.5" text-anchor="start" font-weight="400">2025; gồm thuốc nhập khẩu và biên phân phối</text><rect class="a" x="755.2" y="70" width="8.4" height="14" rx="4"><title>Thị trường dược, tổng chi tiêu: 7.000 đến 8.580 triệu USD</title></rect><text x="749.2338152353782" y="82" class="tx" font-size="12" text-anchor="end" font-weight="600">7.000–8.580</text><text x="20" y="128" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Thị trường TPCN, giá trị bán lẻ</text><text x="20" y="144" class="t2" font-size="10.5" text-anchor="start" font-weight="400">2025; định nghĩa khác nhau giữa các hãng</text><rect class="a" x="673.0" y="122" width="32.4" height="14" rx="4"><title>Thị trường TPCN, giá trị bán lẻ: 960 đến 2.100 triệu USD</title></rect><text x="666.9839840981253" y="134" class="tx" font-size="12" text-anchor="end" font-weight="600">960–2.100</text><text x="20" y="180" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Xuất khẩu rau quả chế biến</text><text x="20" y="196" class="t2" font-size="10.5" text-anchor="start" font-weight="400">2025; đã loại hạt nhập khẩu rồi tái xuất</text><rect class="a" x="692.0" y="174" width="12.6" height="14" rx="4"><title>Xuất khẩu rau quả chế biến: 1.520 đến 2.060 triệu USD</title></rect><text x="686.0084190808211" y="186" class="tx" font-size="12" text-anchor="end" font-weight="600">1.520–2.060</text><text x="20" y="232" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Dược liệu thô, cả nước</text><text x="20" y="248" class="t2" font-size="10.5" text-anchor="start" font-weight="400">một nguồn: 60–100 nghìn tấn × 4.000 USD/tấn</text><rect class="b" x="615.6" y="226" width="21.1" height="14" rx="4"><title>Dược liệu thô, cả nước: 240 đến 400 triệu USD</title></rect><text x="644.7399659771372" y="238" class="tx" font-size="12" text-anchor="start" font-weight="600">240–400</text><text x="20" y="284" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Mọi nguyên vật liệu của 5 hãng dược niêm yết</text><text x="20" y="300" class="t2" font-size="10.5" text-anchor="start" font-weight="400">gồm hoạt chất, tá dược, bao bì; 3 hãng là ước lượng</text><rect class="b" x="602.0" y="278" width="9.8" height="14" rx="4"><title>Mọi nguyên vật liệu của 5 hãng dược niêm yết: 173 đến 219 triệu USD</title></rect><text x="619.8011700449649" y="290" class="tx" font-size="12" text-anchor="start" font-weight="600">173–219</text><text x="20" y="336" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Dược liệu mua từ nguồn nội địa (SAM)</text><text x="20" y="352" class="t2" font-size="10.5" text-anchor="start" font-weight="400">20–30% của dược liệu thô (xem mục 2.1)</text><rect class="b" x="549.0" y="330" width="37.9" height="14" rx="4"><title>Dược liệu mua từ nguồn nội địa (SAM): 48 đến 120 triệu USD</title></rect><text x="594.8960249255606" y="342" class="tx" font-size="12" text-anchor="start" font-weight="600">48–120</text><text x="20" y="388" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Trần doanh thu nguyên liệu của 300 ha</text><text x="20" y="404" class="t2" font-size="10.5" text-anchor="start" font-weight="400">trước chi phí, bán hết; xem mục 4</text><rect class="c" x="384.3" y="382" width="82.5" height="14" rx="4"><title>Trần doanh thu nguyên liệu của 300 ha: 0,9 đến 6,6 triệu USD</title></rect><text x="474.81983437864216" y="394" class="tx" font-size="12" text-anchor="start" font-weight="600">0,9–6,6</text></svg>