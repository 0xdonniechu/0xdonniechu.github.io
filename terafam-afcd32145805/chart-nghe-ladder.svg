weight="600">Nghệ tươi xuất khẩu từ Việt Nam</text><text x="20" y="196" class="t2" font-size="10.5" text-anchor="start" font-weight="400">3,13–3,86 USD/kg · 2026, hàng đặc thù</text><rect class="a" x="560.1" y="174" width="17.4" height="14" rx="4"><title>Nghệ tươi xuất khẩu từ Việt Nam: 79.815 đến 98.430 đồng/kg</title></rect><text x="20" y="232" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Bột thô đến tinh bột, hộ chế biến</text><text x="20" y="248" class="t2" font-size="10.5" text-anchor="start" font-weight="400">150.000–300.000 đ/kg · không rõ ngày</text><rect class="b" x="612.5" y="226" width="57.6" height="14" rx="4"><title>Bột thô đến tinh bột, hộ chế biến: 150.000 đến 300.000 đồng/kg</title></rect><text x="20" y="284" class="tx" font-size="12.5" text-anchor="start" font-weight="600">Chiết xuất xuất khẩu, mã HS 130219</text><text x="20" y="300" class="t2" font-size="10.5" text-anchor="start" font-weight="400">17,2–32,6 USD/kg · 2026, 5 giao dịch</text><rect class="a" x="701.6" y="278" width="53.1" height="14" rx="4"><title>Chiết xuất xuất khẩu, mã HS 130219: 438.600 đến 831.300 đồng/kg</title></rect></svg>