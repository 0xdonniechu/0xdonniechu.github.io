<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 374" width="820" height="374" role="img" aria-labelledby="t d"><title id="t">Thang giá nghệ theo khâu, đồng mỗi kg sản phẩm</title><desc id="d">Từ 8.000–12.000 đồng/kg nghệ tươi đến 438.600–831.300 đồng/kg chiết xuất xuất khẩu. Mỗi bậc khác năm, khác nguồn và khác khối lượng nguyên liệu, nên không phải biên lợi nhuận.</desc>
